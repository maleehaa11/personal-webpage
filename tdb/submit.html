
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit Recipe</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1><a href="index.html" class="logo">The Daily Bite</a></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="recipe.html">Recipe</a>
      <a href="submit.html">Sign up</a>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Recipe Submission Form</h2>
    <form action="#" method="post" class="submit-form">
      <label>
        Recipe Name:
        <input type="text" name="recipeName" required>
      </label>
      <label>
        Category:
        <input type="text" name="category">
      </label>
      <label>
        Ingredients:
        <textarea name="ingredients" rows="4" required></textarea>
      </label>
      <label>
        Upload Image:
        <input type="file" name="image">
      </label>
      <label>
        Your Name:
        <input type="text" name="author" required>
      </label>
      <label>
        Email:
        <input type="email" name="email" required>
      </label>
      <label>
        Instructions:
        <textarea name="instructions" rows="5" required></textarea>
      </label>
      <button type="submit">Submit Your Recipe</button>
    </form>
  </main>

  <footer><p>Follow us on Socials!</p></footer>
</body>
</html>
